# Pour un build statique complet, utilisez:
# rustup target add x86_64-unknown-linux-musl
# apt-get install musl-tools
# cargo build --release --target x86_64-unknown-linux-musl

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
linker = "musl-gcc"

# Host builds (cargo bench, cargo test, cargo flamegraph) keep frame pointers so that
# `perf record --call-graph fp` can unwind every thread; perf's DWARF post-unwinding fails for
# secondary threads with some perf/elfutils combinations. Cost is about 1 %; the musl production
# build above is not affected.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "force-frame-pointers=yes"]
