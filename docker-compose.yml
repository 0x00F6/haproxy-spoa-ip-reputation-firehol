# -----------------------------------------------------------------------------
# Compose project: HAProxy + SPOA IP-reputation stack backed by FireHOL lists.
#
# Services
#   haproxy    - reverse proxy; its SPOE filter forwards each client IP to `spoa`.
#   spoa       - SPOA agent (HAProxy Stream Processing Offload Agent); also runs a
#                FireHOL updater and exposes Prometheus metrics on :8405.
#   prometheus - metrics scraper (HAProxy stats on :8404 + SPOA metrics on :8405).
#   grafana    - dashboards fed by Prometheus (HTTP basic auth admin/admin).
#
# All services share the `proxy` bridge network so they reach each other by service
# name. Persistent data lives in named volumes (FireHOL checkout/MMDB under /app,
# Prometheus TSDB, Grafana data).
# -----------------------------------------------------------------------------

name: haproxy-spoa-ip-reputation-firehol

# Common options factored with a YAML anchor and re-used by every service.
x-common: &common
  restart: unless-stopped

services:
  haproxy:
    image: haproxy:3.4-alpine
    container_name: haproxy
    <<: *common
    ports:
      - "8080:8080" # HTTP frontend
      - "8404:8404" # HAProxy stats, scraped by Prometheus
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/haproxy-spoa-ip-reputation-firehol.cfg:/etc/haproxy/haproxy-spoa-ip-reputation-firehol.cfg:ro
    depends_on:
      spoa:
        condition: service_healthy
    networks:
      - proxy

  spoa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Version embedded in the binary by build.rs; `make docker-compose-build` sets it from git.
        GIT_VERSION: ${GIT_VERSION:-}
    container_name: spoa
    <<: *common
    environment:
      # Values override the runtime-image defaults and match the agent's option names (src/cli.rs).
      RUST_BACKTRACE: "0"
      LOG_LEVEL: "info"
      SPOA_LISTEN_ADRESS: "0.0.0.0:9000"
      SPOA_LISTEN_ADRESS_METRICS_PROMETHEUS: "0.0.0.0:8405"
      DROP_BY_CATEGORY: "abuse,anonymizers,attacks"
      FIREHOL_REPO_URL: "https://github.com/firehol/blocklist-ipsets.git"
      FIREHOL_IGNORE_COUNTRY: "true"
      FIREHOL_UPDATE_CRON_JOB: "@hourly"
    expose:
      - "9000" # SPOE endpoint used by the haproxy filter; not published to the host.
    ports:
      - "8405:8405" # Prometheus metrics, scraped by Prometheus.
    healthcheck:
      # Opens a TCP connection to the SPOA listen address (host and port are
      # split from $${SPOA_LISTEN_ADRESS}); netcat is provided by the runtime image.
      test: ["CMD-SHELL", "nc -z -w1 $${SPOA_LISTEN_ADRESS%:*} $${SPOA_LISTEN_ADRESS#*:}"]
      interval: 2s
      timeout: 2s
      retries: 150 # 5min
      start_period: 2s
    networks:
      - proxy

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    <<: *common
    ports:
      - "9090:9090" # Prometheus UI
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus # Timeseries database, persisted across restarts.
    networks:
      - proxy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--log.level=error"

  grafana:
    image: grafana/grafana:10.1.7
    container_name: grafana
    <<: *common
    ports:
      - "3000:3000" # Grafana UI
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_LOG_LEVEL: error
    depends_on:
      - prometheus
    networks:
      - proxy

volumes:
  prometheus_data:
  grafana_data:

networks:
  proxy:
    driver: bridge
