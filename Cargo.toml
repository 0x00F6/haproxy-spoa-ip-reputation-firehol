[package]
name = "haproxy-spoa-ip-reputation-firehol"
version = "0.1.1"
edition = "2024"
build = "build.rs"

[dependencies]
haproxy-spoe = { git = "https://github.com/git001/haproxy-spoe-rs.git" }

tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
geoip2 = { path = "vendor/geoip2-rs" }
async-watcher = "0.4.0"
arc-swap = "1.7"
self_cell = "1.3"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
tokio-cron-scheduler = "0.15.1"
git2 = { version = "0.21.0", features = ["vendored-openssl", "https"] }
rayon = "1.10"
mmdb-writer = { version = "0.1", default-features = false }
prometheus = { version = "0.14.0", default-features = false }
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
anyhow = { version = "1.0.104", features = ["backtrace"] }

# Criterion benchmarks (`cargo bench`, `make bench`); see benches/spoe/main.rs.
[[bench]]
name = "spoe"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false

[profile.release.package."*"]
opt-level = 3

[profile.dev-opt]
inherits = "release"
debug = true
strip = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph"] }

# Benchmarks run with release optimisations plus limited debug info (line tables and inlined
# frames), so `cargo flamegraph` and the in-process profiler can resolve Rust function names even
# though fat LTO inlines most of the code.
[profile.bench]
debug = 1
strip = false
